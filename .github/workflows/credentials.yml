name: Check credentials
on: [push, pull_request]
permissions:
  contents: read
jobs:
  credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_secrets.py --history
      - run: python3 -m unittest discover -s tests -p test_security_guard.py
      - run: python3 scripts/check_privacy.py
      - run: python3 -m unittest discover -s tests -p test_contact_privacy.py
